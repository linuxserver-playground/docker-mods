name: wait-for-internet
target: universal
title: Universal Wait for Internet
summary: This mod is used to help wait until an active internet connection is established. By default, it will attempt to
  access https://www.linuxserver.io/. If after 60s a connection cannot be established, it will wait for 10s before attempting
  again.
