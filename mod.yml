# Schema: https://github.com/linuxserver-playground/builder/blob/main/schemas/mod.schema.json
schema: 1
name: geoip2influx
target: swag
title: Geoip2Influx
summary: This mod adds a python script that sends geo location metrics from the nginx access log to InfluxDB
maintainers:
- aptalca
- GilbN
- thelamer
platforms:
- amd64
deprecated:
  status: false
docs: "![](.assets/geoip2influx.png)\n\nThe mod will parse the access log for IPs and and convert them into geo metrics for\
  \ InfluxDB. It will also send log metrics if enabled. This mod depends on the [swag-maxmind-mod](https://github.com/linuxserver-playground/docker-mods/tree/swag-maxmind)!\n\
  \nAdd `-e DOCKER_MODS=ghcr.io/linuxserver-playground/mods:swag-geoip2influx|ghcr.io/linuxserver-playground/mods:swag-maxmind`\n\
  \n## Enviroment variables:\n\nThese are the **default** values for all envs.\nAdd the ones that differ on your system.\n\
  \n| Environment Variable | Example Value | Description |\n| -------------------- | ------------- | ----------- |\n| NGINX_LOG_PATH\
  \ | /config/log/nginx/access.log | Container path for Nginx logfile , defaults to the example. |\n| GEO_MEASUREMENT | geoip2influx\
  \ | InfluxDB measurement name for geohashes. Optional, defaults to the example. |\n| LOG_MEASUREMENT | nginx_access_logs\
  \ | InfluxDB measurement name for nginx logs. Optional, defaults to the example. |\n| SEND_NGINX_LOGS | true | Set to `false`\
  \ to disable nginx logs. Optional, defaults to `true`. |\n| GEOIP2INFLUX_LOG_LEVEL | info | Sets the log level in geoip2influx.log.\
  \ Use `debug` for verbose logging Optional, defaults to info. |\n| GEOIP2INFLUX_LOG_PATH | /config/log/geoip2influx/geoip2influx.log\
  \ | Optional. Defaults to example. |\n| GEOIP_DB_PATH | /config/geoip2db/GeoLite2-City.mmdb | Optional. Defaults to example.\
  \ |\n| MAXMINDDB_LICENSE_KEY | xxxxxxx | Add your Maxmind licence key |\n| MAXMINDDB_USER_ID | xxxxxxx| Add your Maxmind\
  \ account id |\n\n**InfluxDB v1.8.x values**\n\n| Environment Variable | Example Value | Description |\n| --------------------\
  \ | ------------- | ----------- |\n| INFLUX_HOST | localhost | Host running InfluxDB. |\n| INFLUX_HOST_PORT | 8086 | Optional,\
  \ defaults to 8086. |\n| INFLUX_DATABASE | geoip2influx | Optional, defaults to geoip2influx. |\n| INFLUX_USER | root |\
  \ Optional, defaults to root. |\n| INFLUX_PASS | root | Optional, defaults to root. |\n| INFLUX_RETENTION | 7d | Sets the\
  \ retention for the database. Optional, defaults to example.|\n| INFLUX_SHARD | 1d | Set the shard for the database. Optional,\
  \ defaults to example. |\n\n**InfluxDB v2.x values**\n\n| Environment Variable | Example Value | Description |\n| --------------------\
  \ | ------------- | ----------- |\n| USE_INFLUXDB_V2 | true | Required if using InfluxDB2. Defaults to false |\n| INFLUXDB_V2_TOKEN\
  \ | secret-token | Required |\n| INFLUXDB_V2_URL | http://localhost:8086 | Optional, defaults to http://localhost:8086 |\n\
  | INFLUXDB_V2_ORG | geoip2influx | Optional, defaults to geoip2influx. Will be created if not exists. |\n| INFLUXDB_V2_BUCKET\
  \ | geoip2influx | Optional, defaults to geoip2influx. Will be created if not exists. |\n| INFLUXDB_V2_RETENTION | 604800\
  \ | Optional, defaults to 604800. 7 days in seconds |\n| INFLUXDB_V2_DEBUG | false | Optional, defaults to false. Enables\
  \ the debug mode for the influxdb-client package. |\n| INFLUXDB_V2_BATCHING | true | Optional, defaults to false. Enables\
  \ batch writing of data. |\n| INFLUXDB_V2_BATCH_SIZE | 100 | Optional, defaults to 10. |\n| INFLUXDB_V2_FLUSH_INTERVAL |\
  \ 30000 | Optional, defaults to 15000. How often in milliseconds to write a batch |\n\n### INFLUXDB_V2_TOKEN\n\nIf the organization\
  \ or bucket does not exist, it will try and create them with the token.\n\n> [!NOTE]\n> The minimim level of rights needed\
  \ is write access to the bucket.\n\n### MaxMind Geolite2\n\nGet your licence key here: https://www.maxmind.com/en/geolite2/signup\n\
  \n## InfluxDB\n\n### InfluxDB v2.x and v1.8x is supported.\n\n#### Note: The Grafana dashboard currently only supports InfluxDB\
  \ v1.8.x\n\nThe InfluxDB database/bucket and retention rules will be created automatically with the name you choose.\n\n\
  ```\n-e INFLUX_DATABASE=geoip2influx or -e INFLUXDB_V2_BUCKET=geoip2influx\n```\n\n***\n\n## Grafana dashboard:\n\nUse [https://github.com/GilbN/geoip2influx/blob/master/nginx_logs_geo_map.json](https://github.com/GilbN/geoip2influx/blob/master/nginx_logs_geo_map.json)\n\
  \n> [!NOTE]\n> Dashboard currently only supports InfluxDB 1.8.x.\n\n***\n\n## Sending Nginx log metrics\n\n1. Setup the\
  \ [swag-maxmind-mod](https://github.com/linuxserver-playground/docker-mods/tree/swag-maxmind)\n\n2. Add the following to\
  \ the http block in your `nginx.conf`file:\n\n```nginx\nlog_format geoip2influx '$remote_addr - $remote_user [$time_local]'\n\
  \           '\"$request\" $status $body_bytes_sent'\n           '\"$http_referer\" $host \"$http_user_agent\"'\n       \
  \    '\"$request_time\" \"$upstream_connect_time\"'\n           '\"$geoip2_data_city_name\" \"$geoip2_data_country_iso_code\"\
  ';\n ```\n\n 3. Set the access log use the `geoip2influx` log format.\n\n Note: The log_format block must be above the access_log\
  \ context.\n ```nginx\n access_log /config/log/nginx/access.log geoip2influx;\n ```\n\n### Multiple log files\n\nIf you\
  \ separate your nginx log files but want this mod to parse all of them you can do the following:\n\nAs nginx can have multiple\
  \ `access log` directives in a block, just add another one in the server block.\n\n**Example**\n\n```nginx\n\taccess_log\
  \ /config/log/nginx/technicalramblings/access.log;\n\taccess_log /config/log/nginx/access.log geoip2influx;\n```\nThis will\
  \ log the same lines to both files.\n\nThen use the `/config/log/nginx/access.log` file in the `NGINX_LOG_PATH` variable.\n"
