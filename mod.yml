# Schema: https://github.com/linuxserver-playground/builder/blob/main/schemas/mod.schema.json
schema: 1
name: docker-in-docker
target: universal
title: Docker-in-docker (dind)
summary: This mod adds docker-in-docker (dind) to Ubuntu and Alpine based images, to be installed/updated during container
  start. Main advantage is that all docker images, containers, volumes, etc. will reside inside the container and will be
  sandboxed from the host's docker environment.
maintainers:
- aptalca
- thelamer
- nemchik
platforms:
- amd64
- arm64
images:
- code-server
- openvscode-server
- vscodium-web
upstream:
  url: https://www.docker.com/
  version:
    type: combined
    sources:
    - type: github_release
      repo: moby/moby
      exclude: ^(?!docker-v)
      transform:
      - regex: ^docker-v
        replace: ''
    - type: github_release
      repo: docker/compose
      transform:
      - regex: ^v
        replace: ''
deprecated:
  status: false
docs: |
  ## How to enable:
  In the container's docker arguments,
  * Set an environment variable `DOCKER_MODS=ghcr.io/linuxserver-playground/mods:universal-docker-in-docker`
  * Set the `privileged` option for the container

  Docker data root will reside under `/config/var/lib/docker` by default, this is configurable by setting `MODS_DIND_PERSISTENCE` to the wanted path.
  On amd64, QEMU will be enabled on container start.
