# Schema: https://github.com/linuxserver-playground/builder/blob/main/schemas/mod.schema.json
schema: 1
name: docker
target: universal
title: Docker
summary: This mod adds the docker binary as wells as the buildx and the compose plug-ins to any linuxserver image.
maintainers:
- aptalca
- nemchik
- thelamer
platforms:
- amd64
- arm64
images:
- code-server
- openvscode-server
- vscodium-web
upstream:
  url: https://www.docker.com/
  version:
    type: combined
    sources:
    - type: github_release
      repo: moby/moby
      exclude: ^(?!docker-v)
      transform:
      - regex: ^docker-v
        replace: ''
    - type: github_release
      repo: docker/compose
      transform:
      - regex: ^v
        replace: ''
deprecated:
  status: false
docs: |
  **IMPORTANT NOTE**: For docker access inside a container, a volume mapping needs to be added for `/var/run/docker.sock:/var/run/docker.sock:ro` in the container's docker run/create/compose. If you'd like to connect to a remote docker service instead, you don't have to map the docker sock; you can either set an env var for `DOCKER_HOST=remoteaddress` or use the docker cli option `-H`.

  ## Security consideration:

  Mapping `docker.sock` is a potential security liability because docker has root access on the host and any process that has full access to `docker.sock` would also have root access on the host. Docker api has no built-in way to set limitations on access, however you can use a proxy for the `docker.sock` via a solution like [our docker socket proxy](https://github.com/linuxserver/docker-socket-proxy), which adds the ability to limit access. Then you would just set `DOCKER_HOST=` environment variable to point to the proxy address.

  Here's a sample compose yaml snippet for the socket proxy:
  ```yaml
    dockerproxy:
      image: lscr.io/linuxserver/socket-proxy:latest
      container_name: dockerproxy
      environment:
        - CONTAINERS=1
        - POST=0
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
      restart: unless-stopped
      read_only: true
      tmpfs:
        - /run
  ```
  The above config for instance would allow read only access to list containers via the docker api. Then the env var in the container with the docker mod can be set as `DOCKER_HOST=dockerproxy`. This will allow the container to retrieve info on other containers, but it won't be allowed to spin up new containers. With the proxy, you can fine tune the permissions very easily.
