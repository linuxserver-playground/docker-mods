schema: 1
name: amd
target: jellyfin
title: jellyfin-amd
summary: This mod adds the mesa libraries (v20.1+) needed for hardware encoding (VAAPI) on AMD GPUs to the Jellyfin Docker
  container (latest tag).
maintainers:
- aptalca
- thelamer
- nemchik
platforms:
- amd64
deprecated:
  status: false
docs: |
  To enable, you need to add the 2 following entries:
  - Device mapping for `/dev/dri` and `/dev/kfd`
    - docker-compose:
      ```yaml
          devices:
            - /dev/dri:/dev/dri
            - /dev/kfd:/dev/kfd
      ```
    - docker cli
      ```sh
      --device /dev/dri:/dev/dri
      --device /dev/kfd:/dev/kfd
      ```
  - Environment Variable: `DOCKER_MODS=ghcr.io/linuxserver-playground/mods:jellyfin-amd`
    - docker-compose:
      ```yaml
          environment:
            - DOCKER_MODS=ghcr.io/linuxserver-playground/mods:jellyfin-amd
      ```
    - docker cli:
      ```sh
      -e DOCKER_MODS=ghcr.io/linuxserver-playground/mods:jellyfin-amd
      ```

  ## Settings in Jellyfin
  Under server administration in `Server > Playback` the `Hardware acceleration` can be set to `Video Acceleration API (VAAPI)` and the `VA API Device` has to be set to the device given in the Docker configuration. For example `/dev/dri/renderD128`.
