# Schema: https://github.com/linuxserver-playground/builder/blob/main/schemas/mod.schema.json
schema: 1
name: multilangocr
target: papermerge
title: Multi Language OCR
summary: This mod adds multi language OCR packages to papermerge and paperless-ng/x, to be installed/updated during container
  start. Keep in mind that you still have to enable the languages in the app itself, as this mod only installs the system
  language packs.
maintainers:
- aptalca
- thelamer
- Roxedus
platforms:
- amd64
deprecated:
  status: true
  message: This mod is deprecated due to Papermerge, Paperless-ng and Paperless-ngx containers having been deprecated
docs: |
  In papermerge/paperless-ng/x docker arguments, set an environment variable `DOCKER_MODS=ghcr.io/linuxserver-playground/mods:papermerge-multilangocr` to enable this mod.

  Then set an environment variable named `OCRLANG` and set it to the language codes that follow `tesseract-ocr-` from [this page](https://packages.ubuntu.com/focal/tesseract-ocr-all). You can add multiple codes that are comma separated, with no spaces.

  For example, if you want to enable OCR for Chinese Simple and Belarusian, you'd set the var as `-e OCRLANG="chi-sim,bel"`.
