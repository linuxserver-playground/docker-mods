# Schema: https://github.com/linuxserver-playground/builder/blob/main/schemas/mod.schema.json
# Converted from linuxserver/docker-mods: upstream computed MOD_VERSION in BuildImage.yml; builds here pass none, so the Dockerfile's own lookup applies
schema: 1
name: dotnet
target: code-server
title: .NET Core SDK
summary: This mod adds .NET CORE SDK to code-server and openvscode-server.
maintainers:
- aptalca
- thelamer
- nemchik
platforms:
- amd64
- arm64
images:
- openvscode-server
- vscodium-web
deprecated:
  status: false
docs: |
  The [current release and all current lts releases](https://dotnet.microsoft.com/download/dotnet-core) will be made available inside the container (5.0.101, 3.1.404 and 2.1.811 as of 2020/12/13).

  The binaries are accessible at `/dotnet_<sdkversion>/dotnet` for each respective version.

  The current version binary is symlinked from `/usr/local/bin/dotnet` so it can be called via `dotnet` from anywhere.
