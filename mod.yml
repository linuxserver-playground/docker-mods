# Schema: https://github.com/linuxserver-playground/builder/blob/main/schemas/mod.schema.json
schema: 1
name: flutter
target: code-server
title: Flutter Beta
summary: This mod adds a Flutter beta dev environment to code-server and openvscode-server, to be installed/updated during
  container start. The environment is already configured to run browser apps.
maintainers:
- aptalca
- flavio20002
- thelamer
platforms:
- amd64
images:
- openvscode-server
- vscodium-web
deprecated:
  status: false
docs: |
  ```
  flutter create myapp
  cd myapp
  flutter run --web-port=8989
  ```

  Open a browser pointing to:

  ```
  https://my-code-server-host.com/proxy/8989

  or

  https://8989.my-code-server-host.com
  ```

  When editing the code, press r and refresh the web page, or install the Flutter extension for code-server or openvscode-server.
