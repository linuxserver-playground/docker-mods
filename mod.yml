# Schema: https://github.com/linuxserver-playground/builder/blob/main/schemas/mod.schema.json
schema: 1
name: powershell
target: code-server
title: PowerShell
summary: This mod adds PowerShell to code-server/openvscode-server, to be installed/updated during container start.
maintainers:
- aptalca
- thelamer
- nemchik
platforms:
- amd64
- arm64
images:
- openvscode-server
- vscodium-web
upstream:
  url: https://github.com/PowerShell/PowerShell
  version:
    type: json
    url: https://raw.githubusercontent.com/PowerShell/PowerShell/master/tools/metadata.json
    jq: .StableReleaseTag
    transform:
    - regex: ^v
      replace: ''
deprecated:
  status: false
